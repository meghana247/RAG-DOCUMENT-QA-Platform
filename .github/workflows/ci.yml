name: CI

on:
  push:
    branches: [main, production-hardening]
  pull_request:
  workflow_dispatch:

env:
  PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
  DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ragdb
  SECURITY__SECRET_KEY: ci-only-secret-key-long-enough-to-pass-validation

jobs:
  checks:
    name: Lint, tests and retrieval eval
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ragdb
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ragdb
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d ragdb"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('app/core/config.py') }}
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests eval
      - run: alembic upgrade head
        env:
          GENERATION__API_KEY: migrations-do-not-call-the-llm
      - run: pytest -q
      - run: python -m eval.run_eval
      - run: python -m eval.check retrieval
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retrieval-eval
          path: eval/results/retrieval.json

  answer-eval:
    name: Answer-quality eval
    needs: checks
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ragdb
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d ragdb"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - name: Require GROQ_API_KEY
        if: env.GROQ_API_KEY == ''
        run: echo "::error::Add a GROQ_API_KEY repository secret to run the answer eval" && exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('app/core/config.py') }}
      - run: pip install -r requirements-dev.txt
      - run: alembic upgrade head
      - run: python -m eval.answer_eval
      - run: python -m eval.check answers
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: answer-eval
          path: eval/results/answers.json
