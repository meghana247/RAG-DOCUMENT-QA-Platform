server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 30m;

  # Resolve the API through Docker's DNS per request, so a recreated API container
  # (new IP) does not leave nginx proxying to a dead address.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api http://api:8000;

  location /api/ {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Chat answers stream as server-sent events; buffering would deliver them in one block.
    proxy_buffering off;
    proxy_read_timeout 300s;
  }

  location / {
    try_files $uri /index.html;
  }
}
